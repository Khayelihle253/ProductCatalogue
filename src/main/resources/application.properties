# Application configuration
spring.application.name=redis-product-catalog
server.port=8081

# H2 Database configuration
spring.datasource.url=jdbc:h2:mem:productdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
#  can access the H2 console by navigating to http://localhost:8081/h2-console
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Redis configuration
spring.redis.host=localhost
spring.redis.port=6379

# Cache configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=60000
#spring.cache.redis.cache-null-values=false //by default cache does not allow nulls unless configured otherwise

# Custom application properties
app.cache.default-ttl-seconds=60
app.database.simulate-latency=true
app.database.latency-ms=500